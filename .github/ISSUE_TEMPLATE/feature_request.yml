
name: 功能建议
description: 建议一个新功能或改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！提交前请确认：
        - 已阅读 [DISCLAIMER.md](../../DISCLAIMER.md)
        - 已搜索现有 Issue，未找到重复
        - 功能不与项目定位冲突（更快捷、更美观、更方便）

  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - Android
        - Web
        - 两者都要
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      placeholder: 在什么情况下需要这个功能？
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望功能
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你是否考虑过其他实现方式？
